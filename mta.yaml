_schema-version: 3.3.0
ID: TIME_SERIES_FORECAST
description: A simple CAP project.
version: 1.0.0

modules:
  - name: TIME_SERIES_FORECAST-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: TIME_SERIES_FORECAST-db
      - name: TIME_SERIES_FORECAST-auth
      - name: TIME_SERIES_FORECAST-destination-service
    provides:
      - name: srv-api
        properties:
          srv-url: '${default-url}'
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci

  - name: TIME_SERIES_FORECAST-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: TIME_SERIES_FORECAST-db
    parameters:
      buildpack: nodejs_buildpack

  - name: TIME_SERIES_FORECAST-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: TIME_SERIES_FORECAST-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: flatfile
          artifacts:
            - flatfile.zip
          target-path: resources/
        - name: jobsumm
          artifacts:
            - jobsumm.zip
          target-path: resources/

  - name: TIME_SERIES_FORECAST-destination-content
    type: com.sap.application.content
    requires:
      - name: TIME_SERIES_FORECAST-destination-service
        parameters:
          content-target: true
      - name: TIME_SERIES_FORECAST-repo-host
        parameters:
          service-key:
            name: TIME_SERIES_FORECAST-html5-service-key
      - name: TIME_SERIES_FORECAST-auth
        parameters:
          service-key:
            name: TIME_SERIES_FORECAST-auth-key
    parameters:
      content:
        instance:
          destinations:
            - Name: TIME_SERIES_FORECAST-html5-repository
              ServiceInstanceName: TIME_SERIES_FORECAST-html5-service
              ServiceKeyName: TIME_SERIES_FORECAST-html5-service-key
              sap.cloud.service: TIME_SERIES_FORECAST.service
            - Name: TIME_SERIES_FORECAST-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: TIME_SERIES_FORECAST-auth
              ServiceKeyName: TIME_SERIES_FORECAST-auth-key
              sap.cloud.service: TIME_SERIES_FORECAST.service
          existing_destinations_policy: update
    build-parameters:
      no-source: true

  - name: flatfile
    type: html5
    path: app/flatfile
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  - name: jobsumm
    type: html5
    path: app/jobsumm
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  - name: TIME_SERIES_FORECAST-python
    type: python
    path: python
    requires:
      - name: TIME_SERIES_FORECAST-db
      - name: TIME_SERIES_FORECAST-destination-service
      - name: TIME_SERIES_FORECAST-auth
      - name: srv-api
    properties:
      CAP_SERVICE_URL: '~{srv-api/srv-url}'
    parameters:
      buildpack: python_buildpack
      command: gunicorn --bind 0.0.0.0:$PORT --timeout 120 --workers 1 app:app
      memory: 2G
      disk-quota: 4G

resources:
  - name: TIME_SERIES_FORECAST-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: TIME_SERIES_FORECAST-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: TIME_SERIES_FORECAST-html5-service
      service-plan: app-host

  - name: TIME_SERIES_FORECAST-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-name: TIME_SERIES_FORECAST-destination-service
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Name: ui5
                Type: HTTP
                URL: 'https://ui5.sap.com'
                ProxyType: Internet
                Authentication: NoAuthentication
              - Name: srv-api
                Type: HTTP
                URL: '~{srv-api/srv-url}'
                ProxyType: Internet
                Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
            existing_destinations_policy: update
        version: 1.0.0
    requires:
      - name: srv-api

  - name: TIME_SERIES_FORECAST-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: 'TIME_SERIES_FORECAST-${org}-${space}'
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production