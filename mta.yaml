_schema-version: 3.3.0
ID: TIME_SERIES_FORECAST
description: A simple CAP project.
version: 1.0.0
modules:
- name: TIME_SERIES_FORECAST-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: TIME_SERIES_FORECAST-db
  - name: TIME_SERIES_FORECAST-auth
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: TIME_SERIES_FORECAST-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: TIME_SERIES_FORECAST-db
  parameters:
    buildpack: nodejs_buildpack
- name: TIME_SERIES_FORECAST-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: TIME_SERIES_FORECAST-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - flatfile.zip
      name: flatfile
      target-path: resources/
- name: flatfile
  type: html5
  path: app/flatfile
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []

- name: TIME_SERIES_FORECAST-python
  type: python
  path: python
  requires:
  - name: TIME_SERIES_FORECAST-auth
  - name: TIME_SERIES_FORECAST-destination-service
  - name: srv-api
    group: destinations
    properties:
      name: cap-service
      url: ~{srv-url}
  properties:
    CAP_SERVICE_URL: ~{srv-api/srv-url}
  parameters:
    buildpack: python_buildpack
    no-route: true
    no-start: true
    command: python fetch_oil_data.py

resources:
- name: TIME_SERIES_FORECAST-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: TIME_SERIES_FORECAST-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: TIME_SERIES_FORECAST-html5-service
    service-plan: app-host
- name: TIME_SERIES_FORECAST-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: destination-service
    service-plan: lite
- name: TIME_SERIES_FORECAST-auth
  type: org.cloudfoundry.managed-service
  parameters:
    service: xsuaa
    service-plan: application
    path: ./xs-security.json
    config:
      xsappname: TIME_SERIES_FORECAST-${org}-${space}
      tenant-mode: dedicated
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
